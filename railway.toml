
[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "node server/index.js"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments]
production.secrets = ["SUPABASE_URL", "SUPABASE_ANON_KEY", "TELEGRAM_BOT_TOKEN", "ADMIN_USER_IDS", "NEWSLETTER_API_KEY"]
