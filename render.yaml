services:
  - type: web
    name: telegram-insider
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    env: node
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_USER_IDS
        value: "123456789"
      - key: FRONTEND_URL
        value: https://tg-insider.onrender.com

envGroups:
  - name: supabase-credentials
    environment: production
  - name: telegram-credentials
    environment: production
